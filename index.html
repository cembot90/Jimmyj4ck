  var KEY_STORE = 'cemil_jack_unlock_v1';
  var form = document.getElementById('f');
  var pw = document.getElementById('pw');
  var go = document.getElementById('go');
  var msg = document.getElementById('msg');
  var remember = document.getElementById('remember');

  function b64ToBytes(s) {
    var bin = atob(s), out = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }
  function bytesToB64(buf) {
    var bytes = new Uint8Array(buf), bin = '';
    for (var i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
    return btoa(bin);
  }
  function show(html) {
    document.open();
    document.write(html);
    document.close();
  }
  function decryptWithKey(key) {
    return crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64ToBytes(P.iv) }, key, b64ToBytes(P.data))
      .then(function (buf) { return new TextDecoder().decode(buf); });
  }
  function importRaw(raw) {
    return crypto.subtle.importKey('raw', raw, { name: 'AES-GCM' }, true, ['decrypt']);
  }
  function deriveKey(password) {
    var enc = new TextEncoder();
    return crypto.subtle.importKey('raw', enc.encode(password.normalize('NFC')), 'PBKDF2', false, ['deriveKey'])

        return crypto.subtle.deriveKey(

          base, { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
      });
  }

  try { saved = localStorage.getItem(KEY_STORE); } catch (e) {}

    importRaw(b64ToBytes(saved)).then(decryptWithKey).then(show).catch(function () {
      try { localStorage.removeItem(KEY_STORE); } catch (e) {}
    });
  }

  form.addEventListener('submit', function (ev) {
    ev.preventDefault();
    if (!pw.value) return;
    go.disabled = true;
    msg.style.color = '#9fb3d4';
    msg.textContent = 'Entsperre …';
    var theKey;
    deriveKey(pw.value).then(function (k) {

      return decryptWithKey(k);
